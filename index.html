<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" href="https://drive.google.com/file/d/1vBEF6Ey6Rp_MX35BSzZeEx4gYGnioQod/view?usp=drive_link">
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPRO - Professional Teacher Supervision System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
      /* Sidebar scroll behavior */
      .sidebar {
        display: flex !important;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      .sidebar-header {
        flex-shrink: 0;
      }
      .sidebar-menu {
        flex-grow: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      /* Scrollbar tipis */
      .sidebar-menu::-webkit-scrollbar { width: 6px; }
      .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
      
      /* Mobile: sidebar full-screen */
      @media (max-width: 768px) {
        .sidebar {
          position: fixed !important;
          top: 0;
          left: 0;
          width: 260px;
          height: 100vh !important;
          z-index: 1000;
          transform: translateX(-100%);
          transition: transform 0.3s ease;
        }
        .sidebar.open {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- Toast Notification -->
    <div id="toast-container"></div>

    <!-- Login Page (dari Login.html) -->
    <div data-include="Login.html"></div>

    <!-- Main Application -->
    <div class="layout" id="app-layout" style="display:none;">

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header" style="text-align: center; padding: 20px 0;">
          <div class="logo">
            <img src="https://drive.google.com/thumbnail?id=1fGRvLBEV1Dw8pOdBBoOzDyrThXb-asfd&sz=w400" alt="Logo SIMPRO" style="width: 187px; height: auto; margin: 0 auto;">
          </div>
          <div style="text-align: center; margin-top: 2px; font-size: 10px; color: #8a9bb5; line-height: 1.3;">
            <div style="font-weight: 600; color: #aebcd0;">Ver 1.10.26</div>
            <div>Developed by <strong>@JK_Harinto</strong></div>
          </div>
        </div>
        
        <ul class="sidebar-menu" id="sidebar-menu"></ul>
      </aside>

      <!-- Main Content -->
      <main class="main-content">

        <header class="header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: white; border-bottom: 1px solid #eef0f4; width: 100%; box-sizing: border-box;">
          <div style="display: flex; align-items: center; gap: 15px;">
            <button class="mobile-toggle" onclick="toggleSidebar()" style="background: none; border: 1px solid #ccc; padding: 4px 10px; border-radius: 4px; cursor: pointer; color: var(--primary-navy);"><i class="fas fa-bars"></i></button>
            <h2 id="page-title" style="margin: 0; color: var(--primary-navy); font-size: 22px; font-weight: 700;">Dashboard</h2>
          </div>

          <div class="header-right" style="display: flex; gap: 15px; align-items: center;">
            <div class="user-profile" style="color: var(--primary-navy); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px;">
              <i class="fas fa-user-circle" style="font-size: 22px;"></i>
              <span id="welcome-user">Admin</span>
            </div>
          </div>
        </header>

        <div class="content">
          <div data-include="Dashboard.html"></div>
          <div data-include="Guru.html"></div>
          <div data-include="Jadwal.html"></div>
          <div data-include="Supervisor.html"></div>
          <div data-include="Observasi.html"></div>
          <div data-include="TindakLanjut.html"></div>
          <div data-include="Laporan.html"></div>
          <div data-include="Instrumen.html"></div>
        </div>
      </main>
    </div>

    <!-- Modal Ubah Password Global -->
    <div id="modal-password" class="modal-overlay" style="display:none;">
      <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
          <h3 style="margin:0; color: var(--primary-navy);">Ubah Password</h3>
          <button class="close-btn" onclick="closePasswordModal()">&times;</button>
        </div>
        <div class="modal-body">
          <form id="formPassword" onsubmit="submitPasswordChange(event)">
            <div class="form-group">
              <label class="form-label">Password Lama</label>
              <input type="password" id="pass-lama" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Password Baru</label>
              <input type="password" id="pass-baru" class="form-control" required>
            </div>
            <button type="submit" id="btn-save-pass" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Simpan Password Baru</button>
          </form>
        </div>
      </div>
    </div>

    <!-- AUTO LOADER -->
    <script>
      (function () {
        var v = Date.now();
        var files = ['api.js', 'google-polyfill.js', 'app.js'];
        function loadNext(index) {
          if (index >= files.length) {
            if (window.__includesLoaded) {
              window.dispatchEvent(new Event('includes-loaded'));
            }
            return;
          }
          var s = document.createElement('script');
          s.src = files[index] + '?v=' + v;
          s.onload = function () { loadNext(index + 1); };
          s.onerror = function () { console.error('[loader] Gagal: ' + files[index]); loadNext(index + 1); };
          document.body.appendChild(s);
        }
        loadNext(0);
      })();
    </script>
  </body>
</html>
