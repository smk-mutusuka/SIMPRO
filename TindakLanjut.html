<div id="page-tindak-lanjut" class="page-section" style="display:none;">
  <div class="card" style="background: var(--white); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid #eef0f4;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
      <h3 style="margin: 0; color: var(--primary-navy); font-size: 20px;"><i class="fas fa-sync-alt"></i> Hasil & Tindak Lanjut Supervisi</h3>
      <div class="search-box">
        <i class="fas fa-search" style="position: absolute; margin-left: 12px; margin-top: 12px; color: var(--text-muted);"></i>
        <input type="text" id="search-tl" placeholder="Cari Guru..." class="form-control" style="padding-left: 35px; width: 220px;" onkeyup="filterTLTable()">
      </div>
    </div>
    
    <div style="overflow-x: auto;">
      <table class="data-table" id="table-tl">
        <thead>
          <tr>
            <th>Tgl Observasi</th>
            <th>Nama Guru (Objek)</th>
            <th>Mata Pelajaran</th>
            <th>Nilai & Predikat</th>
            <th>Status TL</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody-tl"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Tindak Lanjut -->
<div id="modal-tl" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width: 600px;">
    <div class="modal-header">
      <h3 style="margin:0; color: var(--primary-navy);">Form Tindak Lanjut</h3>
      <button class="close-btn" onclick="closeModalTL()">&times;</button>
    </div>
    <div class="modal-body">
      
      <!-- Panel Info Nilai (Tahap 9) -->
      <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary-blue); margin-bottom: 20px; display:flex; justify-content: space-between; align-items:center;">
        <div>
          <strong style="color:var(--text-dark);" id="tl-nama-guru">Nama Guru</strong><br>
          <small id="tl-info-obs">Mapel - Kelas</small>
        </div>
        <div style="text-align:right;">
          <h2 style="margin:0; color:var(--primary-navy);" id="tl-nilai">0</h2>
          <span class="badge" id="tl-predikat" style="background: var(--accent-gold); color: #333;">Predikat</span>
        </div>
      </div>

      <form id="formTL" onsubmit="submitTL(event)">
        <input type="hidden" id="tl-obs-id">
        <input type="hidden" id="tl-guru-id">
        
        <div class="form-group">
          <label class="form-label">Temuan Observasi</label>
          <textarea id="tl-temuan" class="form-control" rows="2" placeholder="Catat hal penting dari hasil observasi..." required></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">Rekomendasi / Saran</label>
          <textarea id="tl-rekomendasi" class="form-control" rows="2" placeholder="Saran perbaikan untuk guru..." required></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">Rencana Tindak Lanjut</label>
          <textarea id="tl-rencana" class="form-control" rows="2" placeholder="Bentuk pelatihan/bimbingan selanjutnya..." required></textarea>
        </div>
        
        <div style="display:flex; gap: 15px;">
          <div class="form-group" style="flex:1;">
            <label class="form-label">Target Tanggal</label>
            <input type="date" id="tl-target" class="form-control" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">Status Penyelesaian</label>
            <select id="tl-status" class="form-control" required>
              <option value="Belum Dimulai">Belum Dimulai</option>
              <option value="Dalam Proses">Dalam Proses</option>
              <option value="Selesai">Selesai</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Catatan Tambahan Supervisor</label>
          <input type="text" id="tl-catatan" class="form-control" placeholder="Opsional...">
        </div>
        
        <!-- Tombol akan disembunyikan via JS jika yang buka adalah GURU -->
        <button type="submit" id="btn-save-tl" class="btn btn-primary" style="margin-top: 10px;">Simpan Tindak Lanjut</button>
      </form>
    </div>
  </div>
</div>
