<div id="page-instrumen" class="page-section" style="display:none;">
  <div class="card" style="background: var(--white); padding: 25px; border-radius: 12px; border: 1px solid #eef0f4;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
      <h3 style="margin: 0; color: var(--primary-navy); font-size: 20px;"><i class="fas fa-list-ul"></i> Manajemen Instrumen</h3>
      <button class="btn btn-primary" style="width: auto;" onclick="openModalInstrumen()"><i class="fas fa-plus"></i> Tambah Instrumen</button>
    </div>
    
    <div style="overflow-x: auto;">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 50px; text-align:center;">Urutan</th>
            <th>Jenis Instrumen</th>
            <th>Aspek</th>
            <th>Indikator / Pertanyaan Rubrik</th>
            <th style="text-align:center;">Status</th>
            <th style="text-align:center;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody-instrumen">
          <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- MODAL INSTRUMEN -->
<div id="modal-instrumen" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width: 600px;">
    <div class="modal-header">
      <h3 style="margin:0; color: var(--primary-navy);" id="modal-title-instrumen">Tambah Instrumen</h3>
      <button class="close-btn" onclick="closeModalInstrumen()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="formInstrumen" onsubmit="submitInstrumen(event)">
        <input type="hidden" id="ins-id">
        
        <div style="display:flex; gap: 15px;">
          <div class="form-group" style="flex:1;">
            <label class="form-label">Jenis Instrumen</label>
            <select id="ins-jenis" class="form-control" required>
              <option value="Administrasi">Supervisi Administrasi</option>
              <option value="Pelaksanaan">Observasi Pelaksanaan</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">Kategori / Aspek</label>
            <input type="text" id="ins-aspek" class="form-control" placeholder="Cth: Keselarasan" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Indikator / Pertanyaan Skala 0-4</label>
          <textarea id="ins-indikator" class="form-control" rows="3" placeholder="Masukkan deskripsi penilaian..." required></textarea>
        </div>
        
        <div style="display:flex; gap: 15px;">
          <div class="form-group" style="flex:1;">
            <label class="form-label">No. Urutan Tampil</label>
            <input type="number" id="ins-urutan" class="form-control" required>
          </div>
          <div class="form-group" style="flex:1;">
             <label class="form-label">Status Tampil</label>
             <select id="ins-status" class="form-control" required>
               <option value="Aktif">Aktif</option>
               <option value="Nonaktif">Nonaktif</option>
             </select>
          </div>
        </div>

        <button type="submit" id="btn-save-instrumen" class="btn btn-primary" style="margin-top: 10px;">Simpan Instrumen</button>
      </form>
    </div>
  </div>
</div>
