<div id="page-supervisor" class="page-section" style="display:none;">
  <div class="card" style="background: var(--white); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid #eef0f4;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
      <div>
        <h3 style="margin: 0; color: var(--primary-navy); font-size: 20px;"><i class="fas fa-user-tie"></i> Data Supervisor</h3>
        <small style="color: var(--text-muted);">Tandai guru yang berhak menjadi supervisor penilai.</small>
      </div>
      <div class="search-box">
        <i class="fas fa-search" style="position: absolute; margin-left: 12px; margin-top: 12px; color: var(--text-muted);"></i>
        <input type="text" id="search-supervisor" placeholder="Cari Nama / NBM..." class="form-control" style="padding-left: 35px; width: 250px;" onkeyup="filterSupervisorTable()">
      </div>
    </div>
    
    <div style="overflow-x: auto;">
      <table class="data-table" id="table-supervisor">
        <thead>
          <tr>
            <th>No</th>
            <th>NBM / NIP</th>
            <th>Nama Guru</th>
            <th>Mata Pelajaran</th>
            <th style="text-align:center;">Status Supervisor</th>
            <th style="text-align:center;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody-supervisor">
          <tr><td colspan="6" style="text-align:center; padding: 20px;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
